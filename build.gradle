plugins {
	id 'dev.architectury.loom-no-remap' version "${architectury_loom_version}" apply false
	id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version
}

subprojects {
	apply plugin: 'java'

	base { archivesName = "${rootProject.archives_base_name}-${project.name}" }

	repositories {
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.neoforged.net/releases/' }
		maven { url = 'https://maven.fabricmc.net/' }
		mavenCentral()
	}

	java { toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int); withSourcesJar() }
	tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = rootProject.java_version as int }
}

tasks.register('runFabricClient') {
	group = 'texture atlas generator development'
	description = 'Launches the Fabric development client with its isolated run directory.'
	dependsOn ':fabric:runClient'
}

tasks.register('runNeoForgeClient') {
	group = 'texture atlas generator development'
	description = 'Launches the NeoForge development client with its isolated run directory.'
	dependsOn ':neoforge:runClient'
}

def fabricReleaseJar = project(':fabric').tasks.named('jar', org.gradle.api.tasks.bundling.AbstractArchiveTask)
def neoForgeReleaseJar = project(':neoforge').tasks.named('jar', org.gradle.api.tasks.bundling.AbstractArchiveTask)

tasks.register('collectReleaseArtifacts', Sync) {
	group = 'build'
	description = 'Collects the Fabric and NeoForge production JARs for CI and releases.'
	dependsOn fabricReleaseJar, neoForgeReleaseJar
	from fabricReleaseJar.flatMap { it.archiveFile }
	from neoForgeReleaseJar.flatMap { it.archiveFile }
	into layout.buildDirectory.dir('libs')
}

tasks.register('build') {
	group = 'build'
	description = 'Builds both client loader variants and collects their production JARs.'
	dependsOn subprojects.collect { it.tasks.named('build') }
	dependsOn tasks.named('collectReleaseArtifacts')
}
