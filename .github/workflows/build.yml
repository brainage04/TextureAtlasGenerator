# Build and GameTest checks for every change.
name: build

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_client_gametests:
        description: Run headless client GameTests
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    uses: brainage04/FabricModdingConventions/.github/workflows/reusable-mod-build.yml@v2.4.0

  client-gametests:
    if: ${{ vars.RUN_CLIENT_GAMETESTS != 'false' && (github.event_name != 'workflow_dispatch' || inputs.run_client_gametests) }}
    uses: brainage04/FabricModdingConventions/.github/workflows/reusable-client-gametests.yml@v2.4.0
    with:
      run_client_gametests: ${{ github.event_name != 'workflow_dispatch' || inputs.run_client_gametests }}

  production-gametests:
    uses: brainage04/FabricModdingConventions/.github/workflows/reusable-production-gametests.yml@v2.4.0
